name: Build ibaal3105

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Clean
        run: |
          xcodebuild clean \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ibaal3105 \
            -configuration Release

      - name: Build
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ibaal3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Locate app
        run: |
          find "$GITHUB_WORKSPACE" \
            -name "ibaal3105.app" \
            -type d \
            -print

      - name: Package IPA staging
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE" \
            -name "ibaal3105.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ibaal3105.app tidak ditemukan"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ibaal3105.app

          zip -r ibaal3105-staging.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-staging
          path: ibaal3105-staging.ipa
