name: Build ibaal3105

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          echo "Xcode:"
          xcodebuild -version
          echo "Developer directory:"
          xcode-select -p

      - name: Verify source files
        run: |
          echo "Checking project..."

          test -f "ibaal3105/ThreeOneOSFive.xcodeproj/project.pbxproj"
          test -f "ibaal3105/ThreeOneOSFive/views/PListEditorView.swift"
          test -f "ibaal3105/ThreeOneOSFive/views/SystemPlistOverwrite.swift"

          echo "All required files found."

      - name: Clean
        working-directory: ibaal3105
        run: |
          xcodebuild clean \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ibaal3105 \
            -configuration Release

      - name: Build
        working-directory: ibaal3105
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ibaal3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find app
        run: |
          echo "Searching for ibaal3105.app..."
          find "$GITHUB_WORKSPACE/build" \
            -name "ibaal3105.app" \
            -type d \
            -print

      - name: Package IPA
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -name "ibaal3105.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ibaal3105.app not found."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/ibaal3105.app

          zip -r ibaal3105-staging.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-staging
          path: ibaal3105-staging.ipa
          if-no-files-found: error
