echo "===== START BUILD ====="
pwd
ls -la

echo "===== XCODE VERSION ====="
xcodebuild -version

echo "===== PROJECT FILES ====="
find . -maxdepth 2 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

echo "===== BUILD ====="

xcodebuild \
  -project ThreeOneOSFive.xcodeproj \
  -scheme ibaal3105 \
  -configuration Release \
  -sdk iphoneos \
  CODE_SIGNING_ALLOWED=NO \
  CODE_SIGNING_REQUIRED=NO \
  build \
  2>&1 | tee build.log

echo "===== BUILD FINISHED ====="
echo "===== LAST 200 LINES ====="

tail -n 200 build.log

echo "===== KEXPLOIT ERRORS ====="

grep -n -i -A15 -B10 \
  "kexploit_opa334" \
  build.log || true

echo "===== CLANG ERRORS ====="

grep -n -E \
  "error:|fatal error:" \
  build.log || true

echo "===== DONE ====="
