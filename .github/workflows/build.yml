set -o pipefail

echo "===== CLEAN BUILD ====="

xcodebuild \
  -project ThreeOneOSFive.xcodeproj \
  -scheme ibaal3105 \
  -configuration Release \
  -sdk iphoneos \
  clean build \
  CODE_SIGNING_ALLOWED=NO \
  2>&1 | tee build.log

BUILD_STATUS=${PIPESTATUS[0]}

echo ""
echo "===== KEXPLOIT OPA334 DIAGNOSTIC ====="

grep -n -A15 -B8 \
  -E "kexploit_opa334\.m|kexploit_opa334\.o|error:" \
  build.log || true

echo ""
echo "===== ALL CLANG ERRORS ====="

grep -n -A8 -B4 \
  -E ":[0-9]+:[0-9]+: error:" \
  build.log || true

echo ""
echo "===== BUILD EXIT CODE: ${BUILD_STATUS} ====="

exit "$BUILD_STATUS"
